name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q

  android:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flet CLI
        run: pip install "flet-cli>=1.1.2"

      # flet build ينزّل Flutter SDK لحاله ويبني الـ APK
      - name: Build APK
        run: flet build apk --yes --arch arm64-v8a

      - uses: actions/upload-artifact@v4
        with:
          name: khatwa-apk
          path: build/apk/*.apk
          if-no-files-found: error

  # يدوي فقط (Actions > Build > Run workflow): يستهلك دقايق macOS أكثر.
  # يبني نسخة محاكي بدون توقيع للتأكد إن الكود يترجم على iOS (ما تتركب على جوال حقيقي).
  # للجوال الحقيقي استخدم الـ job اللي بعده: ios-ipa.
  ios:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "flet-cli>=1.1.2"
      - run: flet build ios-simulator --yes

  # يدوي فقط. يبني ملف IPA غير موقّع تركّبه على آيفون حقيقي بـ Sideloadly (حساب Apple مجاني).
  # Sideloadly يوقّعه بحسابك، والتطبيق ينتهي بعد 7 أيام ويحتاج إعادة تركيب.
  # ما انجرّب بعد على macOS: إذا فشلت خطوة، انسخ آخر أسطر السجل وأصلحها.
  ios-ipa:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "flet-cli>=1.1.2"

      # flet يجهّز مشروع Flutter كامل (مع كود البايثون) في build/flutter.
      # الخطوة الأخيرة عنده (التوقيع) تفشل لأن ما عندنا شهادة، وهذا متوقع،
      # فنكمل بعدها بأنفسنا بدون توقيع.
      - name: Prepare Flutter project with Flet
        run: flet build ipa --yes || true

      - name: Show what Flet prepared
        run: |
          ls -la build || true
          ls -la build/flutter || true

      - name: Build iOS app without code signing
        run: |
          FLUTTER=$(ls -d "$HOME"/flutter/*/bin/flutter | head -1)
          echo "Using $FLUTTER"
          cd build/flutter
          "$FLUTTER" build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          APP=build/flutter/build/ios/iphoneos/Runner.app
          test -d "$APP"
          rm -rf Payload khatwa.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry khatwa.ipa Payload
          ls -la khatwa.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: khatwa-ipa
          path: khatwa.ipa
          if-no-files-found: error
